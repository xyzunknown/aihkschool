<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HKSchoolPlace Mascot Mobile Concepts</title>
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7faf5;
        font-family: Arial, sans-serif;
      }
      .board {
        width: min(1180px, calc(100vw - 48px));
        padding: 28px;
        border-radius: 28px;
        background: #ffffff;
        box-shadow: 0 24px 70px rgba(31, 42, 36, 0.12);
      }
      img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 18px;
      }
    </style>
  </head>
  <body>
    <main class="board">
      <img src="/generated/mascot-workflow-v1.png" alt="HKSchoolPlace mascot mobile UI workflow concepts" />
    </main>
  </body>
