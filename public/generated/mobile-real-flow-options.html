<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>HKSchoolPlace Mobile Real Flow Options</title>
  <style>
    :root {
      --green: #23735a;
      --green-deep: #183a2e;
      --sky: #dff2f7;
      --coral: #ff8469;
      --warm: #fff6e9;
      --line: #dfe9e2;
      --muted: #687972;
      --ink: #18352b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #eef5f0;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang TC", "Noto Sans HK", "Microsoft JhengHei", Arial, sans-serif;
    }
    body::-webkit-scrollbar { display: none; }
    .board {
      width: 1920px;
      height: 1280px;
      padding: 42px 54px 54px;
      background: linear-gradient(135deg, #f8fbf7 0%, #edf7f3 100%);
      overflow: hidden;
      position: relative;
    }
    .board.assistant {
      background: linear-gradient(135deg, #fff8ef 0%, #eaf7fb 100%);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .brand img.logo {
      width: 152px;
      height: auto;
      object-fit: contain;
    }
    .kicker {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .08em;
      color: var(--green);
    }
    h1 {
      margin: 6px 0 0;
      font-size: 44px;
      line-height: 1.08;
      letter-spacing: 0;
    }
    .note {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 590px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.78);
      border-radius: 18px;
      padding: 16px 20px;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.45;
    }
    .note img {
      width: 76px;
      flex: 0 0 auto;
    }
    .phones {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 22px;
    }
    .phone {
      height: 900px;
      border-radius: 36px;
      background: #161d19;
      padding: 9px;
      box-shadow: 0 22px 50px rgba(28, 52, 42, .22);
    }
    .screen {
      position: relative;
      height: 100%;
      border-radius: 28px;
      overflow: hidden;
      background: #ffffff;
    }
    .status {
      height: 34px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      padding: 0 22px 6px;
      font-size: 11px;
      font-weight: 800;
      color: #21372e;
    }
    .status .pill {
      width: 58px;
      height: 5px;
      border-radius: 999px;
      background: rgba(0,0,0,.14);
      position: absolute;
      left: 50%;
      top: 12px;
      transform: translateX(-50%);
    }
    .content {
      height: calc(100% - 92px);
      padding: 18px 18px 10px;
      overflow: hidden;
    }
    .nav {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 58px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: rgba(255,255,255,.96);
      border-top: 1px solid rgba(30,60,45,.08);
    }
    .nav div {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 800;
      color: #83918a;
    }
    .nav i {
      width: 17px;
      height: 17px;
      border-radius: 6px;
      background: #dce8e0;
    }
    .nav .active { color: var(--green); }
    .nav .active i { background: var(--green); }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .location-pill,
    .icon-btn,
    .search-pill,
    .filter-pill {
      border: 1px solid #e3ece7;
      background: rgba(255,255,255,.95);
      box-shadow: 0 8px 20px rgba(31,83,58,.06);
    }
    .location-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 38px;
      padding: 0 16px;
      border-radius: 999px;
      color: var(--green);
      font-size: 13px;
      font-weight: 900;
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #243d33;
    }
    .search-pill {
      height: 58px;
      border-radius: 26px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #7f8d85;
      font-size: 15px;
      font-weight: 800;
    }
    .search-pill svg,
    .location-pill svg,
    .icon-btn svg {
      flex: 0 0 auto;
    }
    .filters-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    .filter-pill {
      height: 42px;
      padding: 0 14px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--green);
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }
    .mini-logo {
      height: 30px;
      width: auto;
      object-fit: contain;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: #eef7f1;
      padding: 2px;
      object-fit: contain;
    }
    h2 {
      margin: 14px 0 7px;
      font-size: 24px;
      line-height: 1.12;
      letter-spacing: 0;
    }
    .sub {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
    }
    .search {
      margin-top: 16px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid #edf1ee;
      box-shadow: 0 8px 20px rgba(31,83,58,.08);
      padding: 13px 14px;
      color: #8a9790;
      font-weight: 800;
      font-size: 12px;
    }
    .hero {
      margin-top: 16px;
      border-radius: 20px;
      padding: 16px;
      min-height: 130px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #e8f4ee, #fff8ed);
    }
    .hero-panel {
      margin-top: 14px;
      border-radius: 24px;
      padding: 16px;
      min-height: 168px;
      display: flex;
      gap: 14px;
      align-items: stretch;
      background: linear-gradient(145deg, #edf6f0 0%, #fff7e9 100%);
      border: 1px solid #e7eee8;
      box-shadow: 0 12px 28px rgba(33,70,50,.08);
    }
    .hero-copy {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
    }
    .hero-copy h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.16;
    }
    .hero-copy p {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
    }
    .hero-visual {
      flex: 0 0 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(255,255,255,.62);
      border: 1px solid rgba(255,255,255,.8);
    }
    .hero-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero-card-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .hero-card-row::-webkit-scrollbar { display: none; }
    .hero-card {
      min-width: 110px;
      border-radius: 18px;
      border: 1px solid #e7eee8;
      background: #fff;
      box-shadow: 0 8px 18px rgba(33,70,50,.06);
      overflow: hidden;
    }
    .hero-card img {
      display: block;
      width: 100%;
      height: 82px;
      object-fit: cover;
    }
    .hero-card div {
      padding: 8px 10px 10px;
      font-size: 11px;
      font-weight: 900;
      color: #28453a;
    }
    .hero img { width: 86px; object-fit: contain; }
    .metric-row, .chips, .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .metric {
      flex: 1 1 calc(50% - 8px);
      border-radius: 16px;
      background: #fff;
      padding: 13px;
      min-height: 78px;
      box-shadow: 0 8px 18px rgba(33,70,50,.07);
    }
    .metric b {
      display: block;
      font-size: 22px;
      color: var(--green);
      margin-top: 5px;
    }
    .metric span, .card span, .small { color: var(--muted); font-size: 11px; line-height: 1.45; }
    .chip, .tab {
      border-radius: 999px;
      padding: 8px 10px;
      background: #eef7f1;
      color: var(--green);
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }
    .chip.active, .tab.active {
      background: var(--green);
      color: #fff;
    }
    .card {
      margin-top: 10px;
      border-radius: 18px;
      background: #fff;
      padding: 13px;
      box-shadow: 0 8px 18px rgba(33,70,50,.08);
      border: 1px solid #eef3ef;
    }
    .card h3 {
      margin: 0 0 5px;
      font-size: 14px;
      line-height: 1.25;
      letter-spacing: 0;
    }
    .card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 5px 8px;
      margin: 8px 4px 0 0;
      background: #eef7f1;
      color: var(--green);
      font-size: 10px;
      font-weight: 900;
    }
    .badge.coral {
      background: #fff0eb;
      color: var(--coral);
    }
    .cta {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 15px;
      background: var(--green);
      color: #fff;
      font-weight: 900;
      font-size: 13px;
      padding: 13px 10px;
      margin-top: 13px;
    }
    .section-title {
      margin: 18px 0 8px;
      font-size: 14px;
      font-weight: 950;
      color: #20372e;
    }
    .countdown {
      border-radius: 18px;
      background: var(--green);
      color: #fff;
      padding: 15px;
      margin-top: 14px;
    }
    .countdown strong {
      display: block;
      font-size: 34px;
      line-height: 1;
      margin-top: 5px;
    }
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 11px;
    }
    .mini {
      border-radius: 16px;
      background: #fff;
      padding: 12px;
      min-height: 80px;
      border: 1px solid #edf2ef;
    }
    .mini b {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
    }
    .article {
      border-left: 4px solid var(--green);
      padding-left: 10px;
    }
    .helper {
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 18px;
      background: #fff8ed;
      border: 1px solid #f3debd;
      padding: 10px;
      margin-top: 12px;
    }
    .helper img { width: 54px; object-fit: contain; }
    .assistant .hero, .assistant-card, .assistant .hero-panel {
      background: linear-gradient(135deg, #fff4e4, #e7f7fb);
    }
    .assistant .location-pill,
    .assistant .icon-btn,
    .assistant .search-pill,
    .assistant .filter-pill,
    .assistant .hero-card {
      border-color: #d6e8ee;
    }
    .assistant .location-pill,
    .assistant .filter-pill {
      color: #2e6e91;
    }
    .assistant .icon-btn {
      color: #2e6e91;
    }
    .assistant .nav .active { color: #2e6e91; }
    .assistant .nav .active i,
    .assistant .chip.active,
    .assistant .tab.active,
    .assistant .countdown,
    .assistant .cta { background: #2e6e91; }
    .assistant .chip,
    .assistant .tab,
    .assistant .badge { background: #e7f4f8; color: #2e6e91; }
    .assistant .metric b,
    .assistant h2,
    .assistant .section-title { color: #1f4353; }
    .assistant .badge.coral { background: #fff0eb; color: #ff8469; }
    .phone-label {
      position: absolute;
      left: 18px;
      top: 792px;
      font-size: 10px;
      color: #98a59e;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <section class="board" id="scheme-a">
    <div class="header">
      <div class="brand">
        <img class="logo" src="/brand/Web Logo/Logo.png" alt="">
        <div>
          <div class="kicker">方案 A｜工具型清爽版</div>
          <h1>把真实功能放在第一位，IP 只做关键提醒</h1>
        </div>
      </div>
      <div class="note">
        <img src="/brand/mascot/04_owl_checklist.png" alt="">
        <div>适合主产品默认方向：筛选、比较、追踪、收藏都更清晰，家长能快速完成决策。</div>
      </div>
    </div>
    <div class="phones" data-scheme="clean"></div>
  </section>

  <section class="board assistant" id="scheme-b">
    <div class="header">
      <div class="brand">
        <img class="logo" src="/brand/Web Logo/Logo.png" alt="">
        <div>
          <div class="kicker" style="color:#2e6e91">方案 B｜温暖助手版</div>
          <h1>让猫头鹰成为流程助手，但不抢走产品功能</h1>
        </div>
      </div>
      <div class="note">
        <img src="/brand/mascot/00_original_owl.png" alt="">
        <div>适合新用户、活动页和个人中心：多一点陪伴感，提醒与空状态更友好。</div>
      </div>
    </div>
    <div class="phones" data-scheme="assistant"></div>
  </section>

  <script>
    const mascot = "/brand/mascot/";
    const nav = (active) => `<div class="nav">${["首页","筛选","康体通","活动","我的"].map(x => `<div class="${x===active ? "active":""}"><i></i>${x}</div>`).join("")}</div>`;
    const status = () => `<div class="status"><span>9:41</span><i class="pill"></i><span>5G</span></div>`;
    const logo = () => `<img class="mini-logo" src="/brand/Web Logo/Logo.png" alt="">`;
    const phone = (body, active, label) => `<div class="phone"><div class="screen">${status()}<div class="content">${body}</div>${nav(active)}<div class="phone-label">${label}</div></div></div>`;
    const home = (warm=false, heroSrc="/brand/hero/hero-mascot-2026-mobile.png", heroAlt="幼稚園搜尋主視覺") => phone(`
      <div class="toolbar">
        <div class="location-pill">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
            <path d="M21 3L10 14l-2 7-1.4-5.6L3 14l7-2 11-9z" />
          </svg>
          九龍城區
        </div>
        <button class="icon-btn" aria-label="通知">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
            <path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 01-3.46 0" />
          </svg>
        </button>
      </div>
      <div class="search-pill" style="margin-top:18px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <line x1="16.5" y1="16.5" x2="22" y2="22" />
        </svg>
        搜尋學校名稱、地區…
      </div>
      <div class="filters-wrap">
        <div class="filter-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
            <path d="M21 3L10 14l-2 7-1.4-5.6L3 14l7-2 11-9z" />
          </svg>
          地區
        </div>
        <div class="filter-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M7 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm10 0a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM1.5 20.25c0-3.45 3.08-6.25 6.88-6.25S15.25 16.8 15.25 20.25H1.5Zm11.25 0c0-2.48 2.33-4.5 5.25-4.5s5.25 2.02 5.25 4.5h-10.5Z" />
          </svg>
          N班
        </div>
        <div class="filter-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 3a8 8 0 1 0 8 8c0-4.42-3.58-8-8-8Zm1 4v5l4 2-.75 1.45L11 12V7h2Z" />
          </svg>
          全日班
        </div>
        <div class="filter-pill">學額</div>
      </div>
      <div class="hero-panel">
        <div class="hero-copy">
          <h2>找到適合 BB 的幼稚園</h2>
          <p>最新學額、學校比較、報名資訊，一站掌握</p>
        </div>
        <div class="hero-visual">
          <img src="${heroSrc}" alt="${heroAlt}">
        </div>
      </div>
      <div class="hero-card-row" aria-label="hero 參考圖">
        <div class="hero-card">
          <img src="/brand/hero/hero-mascot-2026-mobile.png" alt="活潑主視覺">
          <div>活潑主視覺</div>
        </div>
        <div class="hero-card">
          <img src="/brand/hero/hero-family-mobile.png" alt="家庭感主視覺">
          <div>家庭感</div>
        </div>
        <div class="hero-card">
          <img src="/brand/hero/modilan-hero-mobile.png" alt="品牌感主視覺">
          <div>品牌感</div>
        </div>
      </div>
    `, "首页", "首页");
    const schools = () => phone(`
      <div class="topline"><h2 style="margin:0">筛选学校</h2><img class="avatar" src="${mascot}02_owl_magnifying_glass.png"></div>
      <div class="search">输入学校名称 / 地区</div>
      <div class="chips"><span class="chip active">地区</span><span class="chip">类型</span><span class="chip">学额</span><span class="chip">N</span><span class="chip">K1</span><span class="chip">K2</span><span class="chip">K3</span></div>
      <div class="card"><div class="card-row"><h3>明慧幼稚园</h3><b>♥</b></div><span>九龙城 · 私立 · 半日/全日</span><br><span class="badge">K1 有位</span><span class="badge">K2 少量</span><span class="badge coral">K3 满额</span></div>
      <div class="card"><div class="card-row"><h3>快樂天地幼稚園</h3><b>♡</b></div><span>油尖旺 · 非牟利 · 参加免费计划</span><br><span class="badge">N 有位</span><span class="badge">K1 有位</span></div>
      <div class="card"><div class="card-row"><h3>培正幼稚园</h3><b>♡</b></div><span>九龙城 · 热门 · 0.8km</span><br><span class="badge coral">候补</span><span class="badge">可比较</span></div>
      <button class="cta">加入比较 3 间</button>
    `, "筛选", "筛选学校");
    const programme = (warm=false) => phone(`
      <div class="topline"><div><p class="sub">SmartPLAY</p><h2 style="margin:0">康体通追踪</h2></div><img class="avatar" src="${mascot}01_owl_calendar.png"></div>
      ${warm ? `<div class="helper"><img src="${mascot}04_owl_checklist.png"><div><b>小助手提醒</b><p class="sub">热门课程建议提前 10 分钟进入页面。</p></div></div>`:""}
      <div class="countdown"><span>下次开报</span><strong>08:42:19</strong><span>游泳班 / 音乐班 / 亲子体操</span></div>
      <div class="chips"><span class="chip active">幼儿</span><span class="chip">学前</span><span class="chip">运动</span><span class="chip">九龙</span></div>
      <div class="card"><div class="card-row"><h3>儿童游泳初班</h3><span class="badge coral">即将开报</span></div><span>九龙公园 · 4-6 岁 · 免费 · 12 节</span><button class="cta">追踪提醒</button></div>
      <div class="card"><div class="card-row"><h3>亲子音乐启蒙</h3><span class="badge">可报名</span></div><span>沙田大会堂 · 3-5 岁 · $320</span></div>
      <div class="card"><h3>我的追踪</h3><span>已追踪 5 个课程，2 个今日开报</span></div>
    `, "康体通", "康体通");
    const activities = () => phone(`
      <div class="topline"><h2 style="margin:0">课外活动</h2><img class="avatar" src="${mascot}03_owl_star.png"></div>
