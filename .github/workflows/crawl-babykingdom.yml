name: Crawl Baby Kingdom

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max threads (0 = default)"
        required: false
        default: "0"
      dry_run:
        description: "Log only, no DB writes"
        required: false
        default: "false"
      concurrency:
        description: "Preview fetch concurrency"
        required: false
        default: "2"
  schedule:
    - cron: "0 4 1 * *"

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm install --no-save @supabase/supabase-js cheerio robots-parser playwright

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Crawl Baby Kingdom
        run: |
          ARGS=""
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          CONCURRENCY="${{ github.event.inputs.concurrency || '2' }}"
          if [ "$LIMIT" != "0" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ -n "$CONCURRENCY" ]; then ARGS="$ARGS --concurrency $CONCURRENCY"; fi
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/crawlers/babykingdom-preview.mjs $ARGS

      - name: Summary
        if: always()
        run: echo "Baby Kingdom crawl complete."