name: Crawl Media Articles

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max articles"
        required: false
        default: "90"
      source:
        description: "all, ohpama, sundaykiss, parentingheadline"
        required: false
        default: "all"
      dry_run:
        description: "Log only, no DB writes"
        required: false
        default: "false"
  schedule:
    # Every 2 days at 04:30 UTC (12:30 HKT). Cuts API/CI usage in half
    # without losing freshness — open-day & admission articles publish slowly.
    - cron: "30 4 */2 * *"

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Crawl media articles
        run: |
          ARGS="--limit ${{ github.event.inputs.limit || '90' }} --source ${{ github.event.inputs.source || 'all' }}"
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/crawlers/media-articles.mjs $ARGS
