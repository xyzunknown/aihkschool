name: Crawl School Websites

on:
  schedule:
    # Weekly Sunday 18:00 UTC = Monday 02:00 HKT
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max schools to crawl (0 = all)"
        required: false
        default: "10"
      dry_run:
        description: "Dry-run (no DB writes)"
        required: false
        default: "false"

jobs:
  crawl-school-website:
    name: Crawl school official websites
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm install --no-save @supabase/supabase-js

      - name: Run crawler
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '10' }}"
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          node scripts/crawlers/school-website.mjs --limit "$LIMIT" $DRY_RUN_FLAG

      - name: Summary
        if: always()
        run: echo "School website crawl complete."
